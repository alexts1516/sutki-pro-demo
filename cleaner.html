<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23059669'/%3E%3Ctext x='16' y='22.5' font-size='18' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='700'%3E%D0%A1%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#ffffff">
<title>Мои задачи — Сутки·Pro для уборщиков (демо)</title>
<link rel="stylesheet" href="assets/ui.css">
<style>
body{background:#eef1f6}
.shell{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:40px}
@media (min-width:600px){.shell{box-shadow:0 0 0 1px var(--border),0 20px 60px rgba(15,23,42,.08)}}
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:10px 14px}
.top .who b{display:block;font-size:15px;line-height:1.2}
.top .who small{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px}
.top .who small i{width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block}
.top .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--border);background:#fff;color:var(--text2)}
.demo-badge.sm{font-size:11px;padding:4px 8px}
.pad{padding:14px}
.day{background:linear-gradient(135deg,#059669,#10b981 60%,#34d399);color:#fff;border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(5,150,105,.25)}
.day h1{font-size:20px}
.day p{margin:4px 0 0;opacity:.92;font-size:13.5px}
.day .bar{height:8px;background:rgba(255,255,255,.3);border-radius:99px;margin-top:12px;overflow:hidden}
.day .bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .3s}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#e3e8ef;border-radius:12px;padding:3px;margin:14px 0 12px}
.tabs button{height:38px;border-radius:10px;font-weight:650;color:var(--muted)}
.tabs button.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.1)}
.tabs .n{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:#cbd5e1;color:#fff;font-size:11px;margin-left:6px;padding:0 6px}
.tabs button.active .n{background:var(--green)}
.task{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer;display:block;width:100%;text-align:left;transition:transform .12s}
.task:active{transform:scale(.99)}
.task.done{opacity:.8}
.task h3{font-size:16px;margin-top:8px}
.task .addr{color:var(--muted);font-size:13px;margin-top:1px}
.tmeta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--text2)}
.tmeta span{display:inline-flex;align-items:center;gap:5px}
.steps{display:flex;gap:4px;margin-top:12px}
.steps i{flex:1;height:5px;border-radius:99px;background:#e2e8f0}
.steps i.on{background:var(--green)}
.urg{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.urg.red{background:var(--red-50);color:#b91c1c}.urg.amber{background:var(--amber-50);color:#b45309}.urg.grey{background:var(--grey-50);color:#475569}
.empty{text-align:center;color:var(--muted);padding:36px 16px;background:#fff;border-radius:16px;border:1px dashed #cbd5e1}
/* detail */
.dhead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:61px;z-index:20}
.dhead b{font-size:15px}
.sec{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.sec h4{font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info>div{background:var(--grey-50);border-radius:12px;padding:10px}
.info small{display:block;color:var(--muted);font-size:11.5px}
.info b{font-size:14.5px}
.door{background:#0f172a;color:#e2e8f0;border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13px}
.door small{display:block;color:#94a3b8;font-size:11px}
.door b{color:#fff;font-size:15px;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.03em}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 0 2px}
.flow div{text-align:center;font-size:11.5px;color:var(--muted);font-weight:600}
.flow div i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;margin:0 auto 4px;background:#e2e8f0;color:#fff;font-style:normal;font-size:12px}
.flow div.on{color:var(--text)}
.flow div.on i{background:var(--green)}
.flow div.cur i{box-shadow:0 0 0 4px #bbf7d0}
.cl{list-style:none;margin:0;padding:0}
.cl li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--border2);cursor:pointer;font-size:14.5px}
.cl li:last-child{border-bottom:none}
.cl .cb{width:24px;height:24px;border-radius:8px;border:2px solid #cbd5e1;display:grid;place-items:center;color:#fff;flex:none;transition:all .12s}
.cl li.on .cb{background:var(--green);border-color:var(--green)}
.cl li.on{color:var(--muted);text-decoration:line-through}
.cl.ro li{cursor:default}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ph{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1;background:#e2e8f0}
.ph img,.ph svg{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(15,23,42,.65));padding:10px 4px 4px;text-align:center}
.ph .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(15,23,42,.6);color:#fff;display:grid;place-items:center}
.cam{display:flex;gap:8px}
.cam label{flex:1}
.cam input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.cta{position:sticky;bottom:0;z-index:25;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 14px calc(14px + env(safe-area-inset-bottom))}
.cta .btn{height:54px;font-size:16px;border-radius:14px;width:100%}
.errbox{background:var(--red-50);color:#991b1b;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px;display:none}
.errbox.show{display:block}
.sheet-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:520px;background:#fff;border-radius:22px 22px 0 0;z-index:61;padding:10px 16px calc(18px + env(safe-area-inset-bottom));transition:transform .25s ease;max-height:92vh;overflow:auto}
.sheet.open{transform:translate(-50%,0)}
.grab{width:44px;height:5px;border-radius:99px;background:#cbd5e1;margin:0 auto 12px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
.opt{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--border);font-weight:600;font-size:13px;background:#fff}
.opt.on{background:#fee2e2;border-color:#fecaca;color:#b91c1c}
.tgl{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;margin:4px 0 14px;cursor:pointer}
.tgl input{width:20px;height:20px;accent-color:#dc2626}
.done-ov{position:fixed;inset:0;z-index:70;background:rgba(255,255,255,.97);display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
.done-ov.open{display:flex}
.okc{width:84px;height:84px;border-radius:50%;background:var(--green-50);color:var(--green);display:grid;place-items:center;margin:0 auto 16px;animation:tin .3s}
.prob{display:flex;gap:8px;align-items:flex-start;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:9px 11px;font-size:13px;margin-top:8px}
.deny{min-height:100vh;display:grid;place-items:center;padding:24px}
.deny-card{background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);max-width:420px;width:100%;padding:28px 22px;text-align:center}
.deny-ic{width:64px;height:64px;border-radius:18px;background:var(--red-50);color:var(--red);display:grid;place-items:center;margin:0 auto 16px}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="done-ov" id="doneOv"></div>
<div class="toasts" id="toasts"></div>
<script src="assets/data.js"></script>
<script src="assets/store.js"></script>
<script src="assets/cleaner.js"></script>
</body>
</html>
