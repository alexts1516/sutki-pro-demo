<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22.5' font-size='18' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='700'%3E%D0%A1%3C/text%3E%3C/svg%3E">
<title>Вход — Сутки·Pro (демо)</title>
<link rel="stylesheet" href="assets/ui.css">
<style>
body{background:radial-gradient(900px 420px at 90% -10%,#e0e7ff 0,transparent 60%),var(--bg);min-height:100vh}
.top{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;height:64px;padding:0 20px}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.layout{max-width:1040px;margin:12px auto 0;padding:0 20px;display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:22px;align-items:start}
.box{padding:26px}
.box h1{font-size:23px;margin-bottom:4px}
.seg{display:grid;grid-template-columns:1.3fr 1fr 1fr;background:#eef1f6;border-radius:11px;padding:3px;margin:18px 0}
.seg button{height:36px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.1)}
.err{background:var(--red-50);color:#991b1b;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px;display:none}
.err.show{display:block}
.acc-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
.acc-h h2{font-size:16px}
.acc{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--border2)}
.acc:first-of-type{border-top:none}
.acc .cred{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
.acc.off{opacity:.5}
.role-chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.role-owner{background:#ede9fe;color:#6d28d9}.role-admin{background:var(--blue-50);color:#1d4ed8}.role-cleaner{background:#d1fae5;color:#047857}.role-master{background:#ffedd5;color:#c2410c}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2);font-weight:700;padding:14px 20px 4px}
.cur{display:none;background:#eef2ff;border:1px solid #c7d2fe;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13.5px}
.cur.show{display:block}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
@media (max-width:380px){.top .demo-badge{display:none}}
@media (max-width:480px){.box{padding:20px}.acc{padding:12px 14px;flex-wrap:wrap}.acc .btn{margin-left:48px}.top .back span{display:none}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="team.html"><div class="logo">С</div><div><b>Сутки·Pro</b><small>демо-вход</small></div></a>
  <span class="client-chip" title="Клиент: The Address · Apart Hotel"><img src="assets/brand/pin-dark-128.png" alt="" width="22" height="26"><span><b>The Address</b><small>Apart Hotel</small></span></span>
  <div class="right"><span class="demo-badge"><i></i>Демо-данные</span><a class="btn sm back" href="team.html" id="backBtn"></a></div>
</header>
<main class="layout">
  <section class="card box">
    <div class="cur" id="cur"></div>
    <h1>Вход в систему</h1>
    <p class="muted" style="margin:0">Демо без настоящей авторизации — пароль у всех аккаунтов <b>demo</b>.</p>
    <div class="seg" role="tablist"><button data-tab="staff" id="tabStaff">Владелец / админ</button><button data-tab="cleaner" id="tabCleaner">Клининг</button><button data-tab="master" id="tabMaster">Мастер</button></div>
    <form id="loginForm" autocomplete="off">
      <div class="err" id="err"></div>
      <div class="field"><label for="login">Логин</label><input class="input" id="login" placeholder="например, azamat"></div>
      <div class="field"><label for="pass">Пароль</label><input class="input" id="pass" type="password" placeholder="demo"></div>
      <button class="btn primary lg block" type="submit" id="loginBtn">Войти</button>
    </form>
    <p class="muted" style="font-size:12.5px;margin:14px 0 0">Или выберите демо-аккаунт справа — вход в один клик.</p>
  </section>
  <section class="card" id="accounts"></section>
</main>
<div class="demo-foot">Демо-данные: все сотрудники и данные вымышленные · вход хранится в localStorage этого браузера</div>
<div class="toasts" id="toasts"></div>
<script src="assets/data.js"></script>
<script src="assets/store.js"></script>
<script>
(function(){
  const qs = new URLSearchParams(location.search);
  const qr = qs.get('role'); let tab = (qr==='cleaner'||qr==='cleaning') ? 'cleaner' : qr==='master' ? 'master' : 'staff';
  document.getElementById('backBtn').innerHTML = ic('chevL',15)+'<span>Вход для команды</span>';
  const dest = s => isTeamRole(s.role) ? 'cleaning.html' : 'app.html';
  function doLogin(id){
    const r = Auth.login(id);
    if(!r.ok){ showErr(r.msg); return; }
    location.href = dest(r.user);
  }
  function showErr(m){ const e=document.getElementById('err'); e.textContent=m; e.classList.add('show'); }
  function renderAccounts(){
    const staff = allStaff();
    const group = (title, list) => `<div class="grp">${title}</div>` + list.map(s=>`<div class="acc ${s.access?'':'off'}">
      <span class="avatar" style="background:${s.role==='cleaner'?'linear-gradient(135deg,#34d399,#059669)':s.role==='master'?'linear-gradient(135deg,#fb923c,#c2410c)':s.role==='admin'?'linear-gradient(135deg,#60a5fa,#2563eb)':'linear-gradient(135deg,#a78bfa,#6d28d9)'}">${initials(s.name)}</span>
      <div class="grow"><div class="row" style="gap:6px;flex-wrap:wrap"><b>${esc(s.name)}</b><span class="role-chip role-${s.role}">${ROLE_NAME[s.role]}${s.spec?' · '+esc(s.spec.toLowerCase()):''}</span></div>
      <div class="cred">логин: ${esc(s.login)} · пароль: ${esc(s.pass)}${s.access?'':' · <span style="color:#b91c1c;font-family:inherit">доступ отключён</span>'}</div></div>
      <button class="btn sm ${s.role===(tab==='staff'?'owner':tab)?'primary':''}" data-login="${s.id}" ${s.access?'':'disabled'}>Войти как ${esc(s.short)}</button></div>`).join('');
    const own = staff.filter(s=>!isTeamRole(s.role)), cl = staff.filter(s=>s.role==='cleaner'), ms = staff.filter(s=>s.role==='master');
    const G = {staff:group('Владелец и администратор', own), cleaner:group('Клининг · приложение «Сутки·Pro Команда»', cl), master:group('Мастера · ремонты в приложении «Сутки·Pro Команда»', ms)};
    const order = tab==='cleaner' ? ['cleaner','master','staff'] : tab==='master' ? ['master','cleaner','staff'] : ['staff','cleaner','master'];
    document.getElementById('accounts').innerHTML = `<div class="acc-h"><h2>Демо-аккаунты</h2><span class="muted" style="font-size:12.5px">${staff.length} сотрудников</span></div>` + order.map(k=>G[k]).join('');
  }
  function setTab(t){ tab=t; document.getElementById('tabStaff').classList.toggle('active', t==='staff'); document.getElementById('tabCleaner').classList.toggle('active', t==='cleaner'); document.getElementById('tabMaster').classList.toggle('active', t==='master');
    document.getElementById('login').placeholder = t==='cleaner' ? 'например, gulnara' : t==='master' ? 'например, marat' : 'например, azamat'; document.getElementById('err').classList.remove('show'); renderAccounts(); }
  document.addEventListener('click', e=>{
    const b = e.target.closest('[data-login]'); if(b){ doLogin(b.dataset.login); return; }
    const t = e.target.closest('[data-tab]'); if(t){ setTab(t.dataset.tab); return; }
    if(e.target.closest('#curLogout')){ Auth.logout(curScope); location.reload(); }
  });
  document.getElementById('loginForm').addEventListener('submit', e=>{
    e.preventDefault();
    const l = document.getElementById('login').value.trim().toLowerCase(), p = document.getElementById('pass').value;
    const s = allStaff().find(x=>x.login===l);
    if(!s || p!==s.pass){ showErr('Неверный логин или пароль. Подсказка: пароль — demo'); return; }
    doLogin(s.id);
  });
  const curScope = (tab==='staff' ? (Auth.check('panel')?'panel':'team') : (Auth.check('team')?'team':'panel'));
  const u = Auth.check(curScope);
  if(u){ const c=document.getElementById('cur'); c.classList.add('show');
    c.innerHTML = `Вы уже вошли как <b>${esc(u.name)}</b> (${ROLE_NAME[u.role].toLowerCase()}).<div class="row" style="margin-top:8px"><a class="btn sm primary" href="${dest(u)}">Продолжить</a><button class="btn sm" id="curLogout">${ic('logout',14)} Выйти</button></div>`; }
  setTab(tab);
})();
</script>
</body>
</html>
