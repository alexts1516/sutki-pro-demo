<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Сутки·Pro — приложение команды</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22.5' font-size='18' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/shared/ui.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" novalidate>
    <div class="row"><div class="logo">S</div><div><b>Сутки·Pro</b><div class="muted small">приложение команды</div></div></div>
    <h1>Вход</h1><p class="muted small">Водители, мастера и специалисты по подготовке — вход по email или телефону, который дал владелец.</p>
    <label>Email или телефон<input id="lgLogin" autocomplete="username" required></label>
    <label>Пароль<input id="lgPass" type="password" autocomplete="current-password" required></label>
    <div class="alert red" id="lgErr" hidden></div>
    <button class="btn primary block big" id="lgBtn" style="margin-top:14px">Войти</button>
    <p class="muted small" style="margin-top:12px">Демо (пароль demo12345): водитель ruslan@astanastay.example, мастер marat@astanastay.example, подготовка gulnara@astanastay.example</p>
  </form>
</div>
<div id="app" hidden>
  <header class="top"><div class="wrap"><div class="logo">S</div><div class="grow"><b id="who">…</b><small id="acc"></small></div>
    <a class="btn sm" id="adminLink" href="/admin/" hidden>Админка</a><button class="btn sm" id="logout">Выйти</button></div></header>
  <main class="wrap" id="view"></main>
  <nav class="nav" id="nav"></nav>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
